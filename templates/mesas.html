{% extends "base.html" %}

{% block content %}

                <th>Número</th>
                <th>Capacidad</th>
                <th>Ubicación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for mesa in mesas %}

                <td>{{ mesa['id'] }}</td>
                <td>{{ mesa['numero'] }}</td>
                <td>{{ mesa['capacidad'] }}</td>
                <td>{{ mesa['ubicacion'] }}</td>
                <td>
                    
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</div>
{% endblock %}
