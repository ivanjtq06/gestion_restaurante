{% extends "base.html" %}

{% block content %}
<h1>Platos</h1>
<a href="{{url_for('nuevo_plato')}}" class="btn btn-success mb-2">Nuevo</a>
<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for item in platos %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.nombre }}</td>
            <td>{{ item.categoria }}</td>
            <td>{{ item.precio }}</td>
            <td>
                <a href="{{ url_for('editar_plato', id=item.id) }}" class="btn btn-warning">Editar</a>
                <a href="{{ url_for('eliminar_plato', id=item.id) }}" class="btn 
                btn-danger" onclick="return(confirm('Esta seguro ??') )">Eliminar</a>
                


            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
