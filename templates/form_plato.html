{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>
            {% if plato %}
            Editar
            {% else %}
            Nuevo
            {% endif %}
            Plato
        </h2>
    </div>
    <div class="card-body">
        <form action="" method="POST">
            <div class="mb-3">
                <label for="" class="form-label">Nombre</label>
                <input type="text" class="form-control" name="nombre"
                value="{{ plato.nombre if plato else '' }}" required>
            </div>
            <div class="mb-3">
                <label for="" class="form-label">Categoría</label>
                <input type="text" class="form-control" name="categoria" value=
                "{{ plato.categoria if plato else '' }}" required>
            </div>
            <div class="mb-3">
                <label for="" class="form-label">Precio</label>
                <input type="number" step="0.01" class="form-control" name="precio" value=
                "{{ plato.precio if plato else '' }}" required>
            </div>
            <button class="btn btn-primary" type="submit">Enviar</button>
        </form>
    </div>
</div>
{% endblock %}
