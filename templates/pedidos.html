{% extends "base.html" %}

{% block content %}
<h1>Pedidos</h1>
<a href="{{ url_for('nuevo_pedido') }}" class="btn btn-success">Nuevo</a>
<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Mesa</th>
            <th>Plato</th>
            <th>Cantidad</th>
            <th>Hora</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for item in pedidos %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.mesa }}</td>       
            <td>{{ item.plato }}</td>      
            <td>{{ item.cantidad }}</td>
            <td>{{ item.hora }}</td>
            <td>{{ item.estado }}</td>
            <td>
                <a href="{{ url_for('eliminar_pedido', id=item.id) }}"
                class="btn btn-danger" onclick="return(confirm('Esta seguro ??') )
                ">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
